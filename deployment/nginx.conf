# ============================================================
# Quant Platform - Nginx 反向代理配置模板
# ------------------------------------------------------------
# 适用场景：生产环境用 Nginx 托管前端静态资源，并将 API 请求
#           反向代理到后端两个 Spring Boot 服务。
#
# 路由约定（已在代码层固定，勿随意改）：
#   - stock-service   监听 8080，context-path = /api
#   - backend-mp      监听 8082，context-path = /api，路径前缀 /mp
#   - WebSocket(STOMP) 端点 = /api/ws 与 /api/ws-native
#
# 部署前请替换：
#   1) server_name          -> 你的域名
#   2) root                 -> 前端 `npm run build` 产物 dist 的绝对路径
#   3) ssl_certificate/key  -> 真实证书路径（启用 HTTPS 时）
#   4) upstream 中的 IP      -> 若后端在其它主机/容器，改成对应地址
# ============================================================

# 限流 Zone（需置于 http 上下文；本模板被 include 进 http 块时生效）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream quant_stock_service {
    server 127.0.0.1:8080;
}

upstream quant_backend_mp {
    server 127.0.0.1:8082;
}

server {
    listen 80;
    server_name your.domain.com;

    # ---------- 安全加固 ----------
    server_tokens off;                     # 隐藏 Nginx 版本号
    client_max_body_size 20m;              # 限制请求体大小，防大包 DoS

    # 安全响应头（HTTPS 下建议启用 HSTS）
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # 仅在 HTTPS 启用

    # 开启 gzip 压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;

    # 如需强制跳转 HTTPS，取消下一行注释
    # return 301 https://$host$request_uri;

    # ---------- 前端静态资源 ----------
    root /var/www/quant-platform;
    index index.html;

    # SPA 路由回退：未匹配到静态文件时返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 小程序后端：/api/mp/* -> backend-mp ----------
    location /api/mp/ {
        proxy_pass http://quant_backend_mp;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 主后端：其余 /api/* -> stock-service ----------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;   # 突发限流，防接口被刷
        proxy_pass http://quant_stock_service;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- WebSocket(STOMP) 需要 upgrade ----------
    location /api/ws {
        proxy_pass http://quant_stock_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /api/ws-native {
        proxy_pass http://quant_stock_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---------- HTTPS 配置示例（启用时取消注释并填证书） ----------
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/your.domain.com.crt;
    # ssl_certificate_key /etc/nginx/ssl/your.domain.com.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
}
