# ============================================================
# Development Profile
# 本地开发默认值，可直接启动无需额外环境变量
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:stock}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&tinyInt1isBit=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}

# ClickHouse 开发环境连接
clickhouse:
  host: ${CLICKHOUSE_HOST:172.19.72.140}
  port: ${CLICKHOUSE_PORT:8123}
  database: ${CLICKHOUSE_DATABASE:stock}
  username: ${CLICKHOUSE_USER:default}
  # 建议通过环境变量 CLICKHOUSE_PASSWORD 注入，避免弱密码落库；默认值仅用于本地 docker-compose 的 ClickHouse
  password: ${CLICKHOUSE_PASSWORD:quant123}

# CORS 开发环境允许所有来源
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    com.quant.platform: info
