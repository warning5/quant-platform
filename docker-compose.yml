version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-platform
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=quant_platform
      - MYSQL_USERNAME=quant
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-quant123}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=stock
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - quant-net

  mysql:
    image: mysql:8.0
    container_name: quant-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=quant_platform
      - MYSQL_USER=quant
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-quant123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - quant-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: quant-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    networks:
      - quant-net

  redis:
    image: redis:7-alpine
    container_name: quant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - quant-net

volumes:
  mysql-data:
  clickhouse-data:
  redis-data:

networks:
  quant-net:
    driver: bridge
